<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f2233" />
    <title>Stop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <!-- Step 1: brief, before we ask for any permissions -->
    <main class="shell" id="intro">
      <p class="eyebrow" id="eyebrow">Stop</p>
      <h1 id="stopName">Stop</h1>
      <p class="coord" id="coords"></p>

      <div class="rule"></div>

      <div class="status" id="clue"></div>

      <p style="font-size: 15px; color: #1e4b6b; margin: 18px 0 22px">
        The marker only appears when you are close enough. Hold the phone up and
        turn slowly to find it.
      </p>

      <button class="btn btn--go" id="startBtn" type="button">
        Open camera
      </button>
      <a class="btn btn--quiet" href="index.html">Back to the chart</a>

      <div class="foot">
        <span id="devnote"></span>
      </div>
    </main>

    <!-- Step 2: live camera + marker -->
    <div class="ar" id="ar">
      <canvas id="cv"></canvas>
      <div class="hud">
        <div class="readout" id="readout">Finding you&hellip;</div>
        <button class="btn btn--go" id="playBtn" type="button" disabled>
          Get closer
        </button>
        <a class="btn btn--quiet" href="index.html" style="margin-top: 10px"
          >Give up for now</a
        >
      </div>
    </div>

    <video id="vid" playsinline muted style="display: none"></video>

    <script src="hunt.config.js"></script>
    <script src="js/core.js"></script>
    <script>
      (function () {
        var i = parseInt(Hunt.param("i") || "0", 10);
        var stop = Hunt.stopAt(i);
        if (!stop) {
          location.replace("index.html");
          return;
        }

        document.getElementById("eyebrow").textContent =
          "Stop " + (i + 1) + " of " + Hunt.config().stops.length;
        document.getElementById("stopName").textContent = stop.name;
        document.title = stop.name;
        document.getElementById("coords").textContent =
          stop.lat.toFixed(5) +
          "\u00b0N  " +
          stop.lng.toFixed(5) +
          "\u00b0E  \u00b7  within " +
          stop.radius +
          " m";
        document.getElementById("clue").textContent =
          stop.clue || "Find the marker.";

        if (Hunt.devOn()) {
          document.getElementById("devnote").textContent =
            "Test mode: distance check skipped";
        }

        /* ---------- state ---------- */
        var heading = null; // degrees from north
        var pos = null; // {lat,lng,acc}
        var dist = null;
        var inRange = false;
        var t0 = Date.now();

        var cv = document.getElementById("cv");
        var ctx = cv.getContext("2d");
        var vid = document.getElementById("vid");
        var readout = document.getElementById("readout");
        var playBtn = document.getElementById("playBtn");

        playBtn.addEventListener("click", function () {
          location.href = "game.html?i=" + i;
        });

        /* ---------- start (must be a user gesture for iOS) ---------- */
        document
          .getElementById("startBtn")
          .addEventListener("click", function () {
            startOrientation();
            startGeo();
            startCamera();
          });

        function startOrientation() {
          function attach() {
            window.addEventListener("deviceorientationabsolute", onOrient, true);
            window.addEventListener("deviceorientation", onOrient, true);
          }
          var DOE = window.DeviceOrientationEvent;
          if (DOE && typeof DOE.requestPermission === "function") {
            DOE.requestPermission().then(attach).catch(attach);
          } else {
            attach();
          }
        }

        function onOrient(e) {
          if (typeof e.webkitCompassHeading === "number") {
            heading = e.webkitCompassHeading; // iOS, already clockwise from north
          } else if (e.absolute && typeof e.alpha === "number") {
            heading = (360 - e.alpha) % 360;
          } else if (heading === null && typeof e.alpha === "number") {
            heading = (360 - e.alpha) % 360;
          }
        }

        function startGeo() {
          if (Hunt.devOn()) {
            dist = 0;
            inRange = true;
            return;
          }
          if (!navigator.geolocation) {
            readout.textContent = "This phone will not share its location";
            return;
          }
          navigator.geolocation.watchPosition(
            function (p) {
              pos = {
                lat: p.coords.latitude,
                lng: p.coords.longitude,
                acc: p.coords.accuracy,
              };
              dist = Hunt.distance(pos.lat, pos.lng, stop.lat, stop.lng);
              inRange = dist <= stop.radius;
            },
            function (err) {
              readout.textContent =
                err.code === 1
                  ? "Location is blocked \u2014 allow it in Settings"
                  : "Cannot read your location yet";
            },
            { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 }
          );
        }

        function startCamera() {
          navigator.mediaDevices
            .getUserMedia({
              video: { facingMode: { ideal: "environment" } },
              audio: false,
            })
            .then(function (stream) {
              vid.srcObject = stream;
              return vid.play();
            })
            .then(function () {
              document.getElementById("intro").style.display = "none";
              document.getElementById("ar").classList.add("is-live");
              resize();
              requestAnimationFrame(loop);
            })
            .catch(function () {
              alert(
                "The camera did not open. Allow camera access, then reload this page."
              );
            });
        }

        function resize() {
          var d = window.devicePixelRatio || 1;
          cv.width = window.innerWidth * d;
          cv.height = window.innerHeight * d;
        }
        window.addEventListener("resize", resize);
        window.addEventListener("orientationchange", resize);

        /* ---------- drawing ---------- */

        function drawVideoCover() {
          var vw = vid.videoWidth,
            vh = vid.videoHeight;
          if (!vw || !vh) return;
          var scale = Math.max(cv.width / vw, cv.height / vh);
          var w = vw * scale,
            h = vh * scale;
          ctx.drawImage(vid, (cv.width - w) / 2, (cv.height - h) / 2, w, h);
        }

        /* The marker is a sextant reticle: brass rings, a signal-red core. */
        function drawMarker(x, y, t, size) {
          ctx.save();
          ctx.translate(x, y);

          var bob = Math.sin(t / 700) * size * 0.06;
          ctx.translate(0, bob);

          // outer glow so it survives daylight
          var g = ctx.createRadialGradient(0, 0, size * 0.2, 0, 0, size * 1.3);
          g.addColorStop(0, "rgba(216,64,42,0.45)");
          g.addColorStop(1, "rgba(216,64,42,0)");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(0, 0, size * 1.3, 0, Math.PI * 2);
          ctx.fill();

          // rotating outer ring with tick marks
          ctx.save();
          ctx.rotate(t / 2600);
          ctx.strokeStyle = "#a9761f";
          ctx.lineWidth = Math.max(2, size * 0.045);
          ctx.beginPath();
          ctx.arc(0, 0, size, 0, Math.PI * 2);
          ctx.stroke();
          for (var k = 0; k < 12; k++) {
            var a = (k / 12) * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * size * 0.86, Math.sin(a) * size * 0.86);
            ctx.lineTo(Math.cos(a) * size * 0.98, Math.sin(a) * size * 0.98);
            ctx.stroke();
          }
          ctx.restore();

          // crosshair
          ctx.strokeStyle = "rgba(231,237,233,0.9)";
          ctx.lineWidth = Math.max(1.5, size * 0.03);
          ctx.beginPath();
          ctx.moveTo(-size * 0.55, 0);
          ctx.lineTo(size * 0.55, 0);
          ctx.moveTo(0, -size * 0.55);
          ctx.lineTo(0, size * 0.55);
          ctx.stroke();

          // core diamond
          ctx.fillStyle = "#d8402a";
          ctx.beginPath();
          ctx.moveTo(0, -size * 0.34);
          ctx.lineTo(size * 0.34, 0);
          ctx.lineTo(0, size * 0.34);
          ctx.lineTo(-size * 0.34, 0);
          ctx.closePath();
          ctx.fill();

          ctx.restore();
        }

        function drawArrow(delta) {
          var cx = cv.width / 2,
            cy = cv.height / 2;
          var r = Math.min(cv.width, cv.height) * 0.16;
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate((delta * Math.PI) / 180);
          ctx.fillStyle = "rgba(231,237,233,0.92)";
          ctx.strokeStyle = "rgba(15,34,51,0.6)";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(0, -r);
          ctx.lineTo(r * 0.6, r * 0.7);
          ctx.lineTo(0, r * 0.35);
          ctx.lineTo(-r * 0.6, r * 0.7);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }

        function loop() {
          var t = Date.now() - t0;
          ctx.clearRect(0, 0, cv.width, cv.height);
          drawVideoCover();

          if (inRange) {
            var size = Math.min(cv.width, cv.height) * 0.17;
            if (heading === null) {
              // No compass: park the marker in the middle rather than hide it.
              drawMarker(cv.width / 2, cv.height * 0.45, t, size);
            } else {
              var b = Hunt.bearing(
                pos ? pos.lat : stop.lat,
                pos ? pos.lng : stop.lng,
                stop.lat,
                stop.lng
              );
              // In dev mode there is no real bearing; pin it due north.
              if (Hunt.devOn()) b = 0;
              var delta = Hunt.angleDelta(heading, b); // -180..180
              var fov = 55; // degrees across the screen
              if (Math.abs(delta) < fov) {
                var x = cv.width / 2 + (delta / fov) * (cv.width / 2);
                drawMarker(x, cv.height * 0.45, t, size);
              } else {
                drawArrow(delta);
              }
            }
          } else if (heading !== null && pos) {
            var b2 = Hunt.bearing(pos.lat, pos.lng, stop.lat, stop.lng);
            drawArrow(Hunt.angleDelta(heading, b2));
          }

          updateHud();
          requestAnimationFrame(loop);
        }

        function updateHud() {
          if (Hunt.devOn()) {
            readout.textContent = "Test mode \u00b7 marker unlocked";
          } else if (dist === null) {
            readout.textContent = "Finding you\u2026";
          } else if (inRange) {
            readout.textContent =
              "You are here \u00b7 " + Hunt.formatDistance(dist) + " away";
          } else {
            readout.textContent =
              Hunt.formatDistance(dist) +
              " to go" +
              (pos && pos.acc > 25
                ? " \u00b7 weak GPS (\u00b1" + Math.round(pos.acc) + " m)"
                : "");
          }

          if (inRange && playBtn.disabled) {
            playBtn.disabled = false;
            playBtn.textContent = "Take the challenge";
          } else if (!inRange && !playBtn.disabled) {
            playBtn.disabled = true;
            playBtn.textContent = "Get closer";
          }
        }
      })();
    </script>
  </body>
</html>
