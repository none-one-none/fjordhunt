<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e7ede9" />
    <title>Fjordhunt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="devbar"></div>

    <main class="shell">
      <p class="eyebrow" id="eyebrow">Chart 01</p>
      <h1 id="title">Fjordhunt</h1>
      <p class="sub" id="subtitle"></p>

      <div class="rule"></div>

      <ol class="stops" id="stops"></ol>

      <div id="action" style="margin-top: 26px"></div>

      <div class="foot">
        <span id="progress"></span>
        <button id="resetBtn" type="button">Start over</button>
      </div>
    </main>

    <script src="hunt.config.js"></script>
    <script src="js/core.js"></script>
    <script>
      (function () {
        var H = Hunt.config();
        var stops = H.stops;
        var current = Hunt.currentIndex();

        document.getElementById("title").textContent = H.name;
        document.getElementById("subtitle").textContent = H.subtitle || "";
        document.title = H.name;

        /* The ring: a depth contour. Full brass = found, red = live, dashed = not yet. */
        function ring(state, n) {
          var stroke =
            state === "done" ? "#a9761f" : state === "current" ? "#d8402a" : "#0f2233";
          var dash = state === "locked" ? 'stroke-dasharray="3 5"' : "";
          var inner =
            state === "done"
              ? '<circle cx="23" cy="23" r="12" fill="#a9761f" opacity="0.18"/>'
              : "";
          return (
            '<div class="ring"><svg viewBox="0 0 46 46" aria-hidden="true">' +
            inner +
            '<circle cx="23" cy="23" r="21" fill="none" stroke="' +
            stroke +
            '" stroke-width="2" ' +
            dash +
            "/>" +
            '</svg><span class="num" style="color:' +
            stroke +
            '">' +
            n +
            "</span></div>"
          );
        }

        var list = document.getElementById("stops");

        stops.forEach(function (s, i) {
          var done = Hunt.isDone(i);
          var isCurrent = i === current;
          var state = done ? "done" : isCurrent ? "current" : "locked";

          var li = document.createElement("li");
          var tag = done || isCurrent ? "a" : "div";
          var el = document.createElement(tag);
          el.className =
            "stop " +
            (done ? "is-done" : isCurrent ? "is-current" : "is-locked");
          if (tag === "a") el.href = "stop.html?i=" + i;

          var meta = done
            ? "Found"
            : isCurrent
            ? "Go here now"
            : "Locked";

          /* The clue only makes sense once you're allowed to look for it. */
          var clue =
            isCurrent && s.clue
              ? '<p class="stop-clue">' + s.clue + "</p>"
              : "";

          el.innerHTML =
            ring(state, i + 1) +
            '<div class="stop-body">' +
            '<div class="stop-name">' +
            (done || isCurrent ? s.name : "\u2014\u2014\u2014") +
            "</div>" +
            '<div class="stop-meta">' +
            meta +
            (done || isCurrent
              ? " \u00b7 " + s.game + " \u00b7 " + s.radius + " m"
              : "") +
            "</div>" +
            clue +
            "</div>";

          li.appendChild(el);
          list.appendChild(li);
        });

        /* Primary action */
        var action = document.getElementById("action");
        if (current === -1) {
          action.innerHTML =
            '<div class="status status--go">' +
            (H.finale || "Hunt complete.") +
            "</div>";
        } else {
          action.innerHTML =
            '<a class="btn btn--go" href="stop.html?i=' +
            current +
            '">' +
            (Hunt.isDone(0) || current > 0
              ? "Continue to stop " + (current + 1)
              : "Begin the hunt") +
            "</a>";
        }

        var doneCount = stops.filter(function (_, i) {
          return Hunt.isDone(i);
        }).length;
        document.getElementById("progress").textContent =
          doneCount + " of " + stops.length + " found";
        document.getElementById("eyebrow").textContent =
          "Chart \u00b7 " + stops.length + " stops";

        document.getElementById("resetBtn").addEventListener("click", function () {
          if (confirm("Clear your progress and start from stop 1?")) {
            Hunt.reset();
            location.reload();
          }
        });

        /* Dev bar — only visible when dev mode is on */
        if (Hunt.devOn()) {
          var bar = document.getElementById("devbar");
          bar.className = "devbar";
          bar.innerHTML =
            "Test mode: location checks are skipped \u00b7 " +
            '<button id="devoff" style="background:none;border:none;color:#fff;text-decoration:underline;font:inherit;cursor:pointer">turn off</button>';
          document.getElementById("devoff").addEventListener("click", function () {
            Hunt.setDev(false);
            location.href = "index.html";
          });
        }
      })();
    </script>
  </body>
</html>
